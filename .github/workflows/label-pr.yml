name: Label PR

# pull_request_target runs in the base repository with a write token, so fork PRs
# can be labelled. This workflow therefore never checks out or runs PR code: its
# only step is actions/labeler, which reads .github/labeler.yml from the base
# branch through the API. It is the only workflow allowed to use this trigger
# (scripts/check-hygiene.sh enforces that).
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: label
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
