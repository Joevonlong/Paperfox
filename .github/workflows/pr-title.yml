name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check Conventional Commits title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+'
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "PR title ok: $TITLE"
          else
            echo "PR title: $TITLE"
            echo "::error title=PR title::Use <type>(<scope>)?!?: <summary>, where type is one of feat, fix, perf, refactor, docs, test, build, ci, chore, revert (example: fix(server): handle empty DOI)."
            exit 1
          fi
