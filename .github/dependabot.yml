# Dependency updates. No auto-merge while PaperTrail is 0.x: a maintainer reviews every PR.
# Minor and patch updates are grouped; each major update gets its own PR. A dependency goes
# to the first group it matches, so ai-sdk comes first. AI SDK PRs are labelled needs-eval
# (see .github/labeler.yml).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: build
      include: scope
    groups:
      ai-sdk:
        patterns: ["ai", "@ai-sdk/*"]
        update-types: [minor, patch]
      runtime-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    commit-message:
      prefix: build

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    commit-message:
      prefix: ci
